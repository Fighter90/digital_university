# deploy/docker-compose.yml — DIG-7: app + PostgreSQL + Caddy (+ tools для миграций/сида).
# Локально: cp .env.example .env && docker compose -f deploy/docker-compose.yml up --build
# Прод: SITE_ADDRESS=ostrovok.store в .env — Caddy сам получит HTTPS (HTTP-01).
# Разовые задачи БД: docker compose --profile tools run --rm tools sh -c \
#   'node_modules/.bin/prisma migrate deploy && node_modules/.bin/tsx prisma/seed.ts'
name: digital-university

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER:-university}" -d "$${POSTGRES_DB:-university}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  tools:
    profiles: ['tools']
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tools
    env_file:
      - path: ../.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    command: ['sleep', 'infinity']

volumes:
  db-data:
  caddy-data:
  caddy-config:
