# DIG-7 — локальный и продовый запуск «Цифрового деканата» одной командой:
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml up --build
# Кабинет: http://localhost:3000 (health: /api/health), наружу — Caddy (80/443).
# Секреты читаются только из .env (в git не попадает) или секретов хостинга.
name: digital-university

services:
  # PostgreSQL 16 с постоянным volume; наружу не торчит (только loopback по желанию).
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      # только loopback: БД наружу не торчит; нужен для psql/Prisma Studio с хоста
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER:-university}" -d "$${POSTGRES_DB:-university}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Next.js standalone (deploy/Dockerfile); миграции Prisma — при старте контейнера.
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      # публикуем только loopback: деплой проверяет http://localhost:3000/api/health,
      # публичный трафик идёт через caddy (внутренняя сеть compose)
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  # Reverse proxy: локально :80, в проде автоматический HTTPS (Let's Encrypt).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:

  # Разовые задачи БД (миграции/сид): docker compose --profile tools run --rm tools sh -c '...'
  tools:
    profiles: ['tools']
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tools
    env_file:
      - path: ../.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    command: ['sleep', 'infinity']

