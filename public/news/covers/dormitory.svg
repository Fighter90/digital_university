<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Иллюстрация: общежитие">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="130" cy="86" r="95" fill="#a7f3d0" opacity="0.65"/>
  <circle cx="560" cy="300" r="88" fill="#a7f3d0" opacity="0.5"/>
  <!-- здание общежития -->
  <g transform="translate(320 200)">
    <rect x="-170" y="-110" width="340" height="220" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="9"/>
    <rect x="-170" y="-110" width="340" height="36" rx="14" fill="#10b981"/>
    <rect x="-170" y="-86" width="340" height="12" fill="#10b981"/>
    <!-- окна (3 этажа × 4) -->
    <g fill="#a7f3d0" stroke="#10b981" stroke-width="5">
      <rect x="-136" y="-52" width="52" height="40" rx="6"/>
      <rect x="-64" y="-52" width="52" height="40" rx="6"/>
      <rect x="8" y="-52" width="52" height="40" rx="6"/>
      <rect x="80" y="-52" width="52" height="40" rx="6"/>
      <rect x="-136" y="8" width="52" height="40" rx="6"/>
      <rect x="8" y="8" width="52" height="40" rx="6"/>
      <rect x="80" y="8" width="52" height="40" rx="6"/>
      <rect x="-136" y="66" width="52" height="34" rx="6"/>
      <rect x="80" y="66" width="52" height="34" rx="6"/>
    </g>
    <!-- дверь -->
    <rect x="-26" y="60" width="56" height="50" rx="6" fill="#10b981"/>
    <circle cx="10" cy="88" r="5" fill="#ffffff"/>
  </g>
  <!-- деревья -->
  <g stroke="#047857" stroke-width="8" stroke-linecap="round">
    <path d="M96 310 v-40"/>
    <path d="M556 320 v-36"/>
  </g>
  <circle cx="96" cy="246" r="34" fill="#34d399"/>
  <circle cx="556" cy="258" r="30" fill="#34d399"/>
</svg>
